<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-labelledby="title desc"><title id="title">Tatsächlich gehörte Version zu Fehler finden 3: Akzente auf 2 und 2e</title><desc id="desc">4/4-Takt: eine Viertelnote auf Schlag 1, vier Sechzehntel auf Schlag 2 und je zwei verbundene Achtel auf den Schlägen 3 und 4. Die Sechzehntelpositionen 2 und 2e sind akzentuiert; rote Akzente zeigen die Abweichung.</desc><rect width="800" height="170" fill="white"/><path d="M65 124H745 M75 106v36 M745 106v36" stroke="black" stroke-width="1.5"/><g fill="black" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="110" y="28">1</text><text x="270" y="28">2</text><text x="310" y="28">e</text><text x="350" y="28">&amp;</text><text x="390" y="28">a</text><text x="430" y="28">3</text><text x="510" y="28">&amp;</text><text x="590" y="28">4</text><text x="670" y="28">&amp;</text></g>
