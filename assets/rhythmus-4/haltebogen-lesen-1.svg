<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
<title id="title">Leseübung 1: Haltebogen zwischen zwei Achtelnoten</title>
<desc id="desc">Ein 4/4-Takt mit Viertelnoten auf Schlag 1 und 2. Auf Schlag 3 und 4 stehen jeweils zwei verbalkte Achtel. Ein Haltebogen verbindet die zweite Achtel auf 3-und mit der ersten Achtel auf Schlag 4.</desc>
