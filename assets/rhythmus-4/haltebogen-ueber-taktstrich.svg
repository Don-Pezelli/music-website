<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="225" viewBox="0 0 1200 225" role="img" aria-labelledby="title desc"><title id="title">Gemischter Rhythmus über zwei 4/4-Takte mit Haltebogen über den Taktstrich</title><desc id="desc">Im ersten Takt: Viertelnote auf Schlag eins, zwei Achtel auf Schlag zwei, vier Sechzehntel auf Schlag drei und eine Viertelnote auf Schlag vier. Diese Viertelnote ist über den Taktstrich an die Viertelnote auf Schlag eins des zweiten Takts gebunden. Auf Schlag zwei des zweiten Takts stehen drei Achtel als Triole; auf Schlägen drei und vier eine halbe Note. Jeder Takt umfasst genau vier Schläge.</desc><rect width="1200" height="225" fill="white"/><path d="M100 165H1100" stroke="black" stroke-width="1"/><text x="40" y="164" font-family="Georgia,serif" font-size="23" font-weight="bold">4</text><text x="40" y="184" font-family="Georgia,serif" font-size="23" font-weight="bold">4</text><path d="M130 146v38M600 146v38M1080 146v38" stroke="black" stroke-width="1.5"/><g fill="black"><text x="190" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">1</text><text x="300" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">2</text><text x="355" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">&amp;</text><text x="410" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">3</text><text x="437.5" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">e</text><text x="465" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">&amp;</text><text x="492.5" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">a</text><text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">4</text><text x="670" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">1</text><text x="780" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">2</tex