<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-labelledby="title desc"><title id="title">Punktierte Viertelnote gleich Viertelnote plus Achtelnote</title><desc id="desc">Zwei gelbe Taktfelder mit blauen Zählboxen 1, und, 2. Die punktierte Viertelnote ist gleich Viertelnote plus Achtelnote. Ein Bindebogen verbindet Viertel- und Achtelnote.</desc><rect width="680" height="240" fill="#fff34f"/><rect x="5" y="5" width="670" height="230" rx="8" fill="none" stroke="#111" stroke-width="8"/><rect x="22" y="27" width="88" height="55" fill="#00a8ef"/><text x="66" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">1</text><rect x="116" y="27" width="88" height="55" fill="#00a8ef"/><text x="160" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">&amp;</text><rect x="210" y="27" width="88" height="55" fill="#00a8ef"/><text x="254" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">2</text><rect x="392" y="27" width="88" height="55" fill="#00a8ef"/><text x="436" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">1</text><rect x="486" y="27" width="88" height="55" fill="#00a8ef"/><text x="530" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">&amp;</text><rect x="580" y="27" width="88" height="55" fill="#00a8ef"/><text x="624" y="66" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">2</text><g fill="#111"><rect x="326" y="50" width="31" height="5"/><rect x="326" y="64" width="31" height="5"/></g><g><ellipse cx="66" cy="176" rx="17" ry="11" transform="rotate(-25 66 176)" fill="#111"/><path d="M81 172V105" stroke="#111" stroke-width="5"/><circle cx="105" cy="174" r="5" fill="#111"/><ellipse cx="436" cy="176" rx="17" ry="11" transform="rotate(-25 436 176)" fill="#111"/><path d="M451 172V105" stroke="#111" stroke-width="5"/><ellipse cx="624" cy="176" rx="17" ry="11" transform="rotate(-25 624 176)" fill="#111"/><path d="M639 172V105" stroke="#111" stroke-width="5"/><path d="M639 108c28 9 22 23 4 33" fill="none" stroke="#111" stroke-width="5"/></g><path d="M527 172h22M538 161v22" stroke="#111" stroke-width="5" stroke-linecap="square"/><path d="M452 186 Q530 210 608 186" fill="none" stroke="#111" stroke-width="4"/></svg>
