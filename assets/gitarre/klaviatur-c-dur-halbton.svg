<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" role="img" aria-labelledby="title desc"><title id="title">C-Dur auf der Klaviatur</title><desc id="desc">Die weißen Tasten C D E F G A B C bilden C-Dur. Die Halbtonschritte E-F und B-C sind rot markiert.</desc><rect width="700" height="220" fill="#fff"/><g stroke="#263438" stroke-width="2"><rect x="20" y="20" width="80" height="130" fill="#fff"/><rect x="100" y="20" width="80" height="130" fill="#fff"/><rect x="180" y="20" width="80" height="130" fill="#fff"/><rect x="260" y="20" width="80" height="130" fill="#fff"/><rect x="340" y="20" width="80" height="130" fill="#fff"/><rect x="420" y="20" width="80" height="130" fill="#fff"/><rect x="500" y="20" width="80" height="130" fill="#fff"/><rect x="580" y="20" width="80" height="130" fill="#fff"/></g><g fill="#263438"><rect x="76" y="20" width="48" height="82" rx="2"/><rect x="156" y="20" width="48" height="82" rx="2"/><rect x="316" y="20" width="48" height="82" rx="2"/><rect x="396" y="20" width="48" height="82" rx="2"/><rect x="476" y="20" width="48" height="82" rx="2"/></g><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#263438"><text x="60" y="178">C</text><text x="140" y="178">D</text><text x="220" y="178">E</text><text x="300" y="178">F</text><text x="380" y="178">G</text><text x="460" y="178">A</text><text x="540" y="178">B</text><text x="620" y="178">C</text></g><g stroke="#d33" stroke-width="5"><line x1="260" y1="27" x2="260" y2="145"/><line x1="580" y1="27" x2="580" y2="145"/></g><g font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#a13922"><text x="260" y="207">E–F</text><text x="580" y="207">B–C</text></g></svg>