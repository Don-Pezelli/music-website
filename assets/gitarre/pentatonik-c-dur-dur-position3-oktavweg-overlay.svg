<circle cx="765" cy="285" r="17" fill="var(--pitch-2)" stroke="#657c67" stroke-width="1.5"/><text x="765" y="290" fill="#202e31">D</text><text x="765" y="317" font-size="12" fill="#202e31">Z</text>
<circle cx="865" cy="285" r="17" fill="var(--pitch-4)" stroke="#657c67" stroke-width="1.5"/><text x="865" y="290" fill="#202e31">E</text><text x="865" y="317" font-size="12" fill="#202e31">K</text>
<circle cx="765" cy="230" r="17" fill="var(--pitch-7)" stroke="#195b7a" stroke-width="1.5"/><text x="765" y="235" fill="#fff">G</text><text x="765" y="262" font-size="12" fill="#202e31">Z</text>
<circle cx="865" cy="230" r="17" fill="var(--pitch-9)" stroke="#655381" stroke-width="1.5"/><text x="865" y="235" fill="#fff">A</text><text x="865" y="262" font-size="12" fill="#202e31">K</text>
<circle cx="815" cy="175" r="17" fill="var(--pitch-0)" stroke="#9e351c" stroke-width="1.5"/><text x="815" y="180" fill="#fff">C</text><text x="815" y="207" font-size="12" fill="#202e31">M</text>
