<title id="title">C-Dur-Pentatonik, Dur-Position 1, Griffweg 1 über eine Oktave auf dem ganzen Griffbrett</title>
<desc id="desc">C-Dur auf dem Griffbrett: C, D, E, F, G, A, B und C. F und B sind rot umrandet, da sie die zwei Töne ergänzen, die in der Dur-Pentatonik fehlen.</desc>
