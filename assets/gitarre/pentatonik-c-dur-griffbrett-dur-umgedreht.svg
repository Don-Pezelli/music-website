<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Ganzes Gitarrengriffbrett mit den fünf Positionen der C-Dur-Pentatonik</title>
<desc id="desc">Sechs Saiten vom offenen Ton bis zum fünfzehnten Bund, tiefe E-Saite unten, zeigen alle Töne der C-Dur-Pentatonik. Die C-Töne als Dur-Grundton sind rot, die A-Töne als paralleler Moll-Grundton blau hervorgehoben. Darunter markieren fünf farbige Bänder die Bereiche der Dur-Positionen 1 bis 5.</desc>
