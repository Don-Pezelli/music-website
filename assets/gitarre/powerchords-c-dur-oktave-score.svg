  <title id="title">C-Dur-Powerchords mit Oktave · Standardnotation und Tabulatur</title>
  <desc id="desc">Die sieben Akkordstufen erscheinen als Grundton, Quinte und Oktave, mit den passenden Griffen in Gitarrentabulatur. Stufe sieben B–F–B ist die Ausnahme mit verminderter Quinte. Sieben Viertelgriffe und eine Viertelpause in zwei 4/4-Takten.</desc>
