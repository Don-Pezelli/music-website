<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
<title id="title">C-Dur-Dreiklang auf dem ganzen Griffbrett</title>
<desc id="desc">Sechs Saiten vom offenen Ton bis zum fünfzehnten Bund zeigen alle Töne der C-Dur-Pentatonik. Die Töne C, E und G bilden den C-Dur-Grundakkord. Grundton C bleibt rot, Terz E violett und Quinte G grün. Rote Linien verbinden die Akkordtöne zu den markierten Formen. Die farbigen Bänder zeigen die fünf Dur-Positionen. Rote Markierungen zeigen die E-Dur-Barreform in Dur-Position 1 ab Bund 8 und die D-Form mit G12, C13 und E12 sowie die nächste Form mit A15, D14 und G12</desc>
<rect width="1000" height="590" fill="#fff"/>
<text x="30" y="35" fill="#202e31" font-family="Arial,sans-serif" font-size="22" font-weight="700">C-Dur-Pentatonik · gesamtes Griffbrett</text>
