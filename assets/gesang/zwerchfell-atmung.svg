    .airway { fill: none; stroke: #975e74; stroke-linecap: round; stroke-width: 5; }
    .diaphragm, .arrow { fill: none; stroke: #23776b; stroke-linecap: round; stroke-linejoin: round; }
    .diaphragm { stroke-width: 6; }
    .arrow { stroke-width: 3; }
  </style>
