<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
  <title id="title">Zwei leere 4/4-Takte mit vier Einsetzfeldern</title>
  <desc id="desc">Jeder der beiden Takte ist in zwei leere Abschnitte geteilt. Setze Noten und Pausen ein, bis jeder Takt vier Schläge enthält.</desc>
  <rect width="960" height="150" fill="#fff"/>
  <path d="M88 86v38M88 105H508 M508 86v38 M510 86v38M510 105H930 M930 86v38" stroke="#111" fill="none" stroke-width="1.5"/>
  <text x="55" y="100" font-family="Georgia,serif" font-size="23">4</text><text x="55" y="120" font-family="Georgia,serif" font-size="23">4</text>
  <g fill="#fff" stroke="#65706e" stroke-width="2" stroke-dasharray="6 4">
    <rect data-gap="true" x="99" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="198" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="297" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="396" y="61" width="88" height="70" rx="4"/>
    <rect data-gap="true" x="521" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="620" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="719" y="61" width="88" height="70" rx="4"/><rect data-gap="true" x="818" y="61" width="88" height="70" rx="4"/>
  </g>
  <g fill="#65706e" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
    <text x="143" y="108">?</text><text x="242" y="108">?</text><text x="341" y="108">?</text><text x="440" y="108">?</text><text x="565" y="108">?</text><text x="664" y="108">?</text><text x="763" y="108">?</text><text x="862" y="108">?</text>
  </g>
  <g data-beat-counts="true" display="none" fill="#d4e1d3" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="114" y="38">1</text><text x="164" y="38">&amp;</text><text x="214" y="38">2</text><text x="264" y="38">&amp;</text><text x="314" y="38">3</text><text x="364" y="38">&amp;</text><text x="414" y="38">4</text><text x="464" y="38">&amp;</text>
    <text x="536" y="38">1</text><text x="586" y="38">&amp;</text><text x="636" y="38">2</text><text x="686" y="38">&amp;</text><text x="736" y="38">3</text><text x="786" y="38">&amp;</text><text x="836" y="38">4</text><text x="886" y="38">&amp;</text>
