<title id="title">Ein Ton bewegt sich nach oben</title>
<desc id="desc">Auf weißem Hintergrund markieren zwei gleich große Punkte Ausgangs- und Zielton. Ein Pfeil führt dazwischen im 45-Grad-Winkel nach oben rechts: Der zweite Ton ist höher.</desc>
