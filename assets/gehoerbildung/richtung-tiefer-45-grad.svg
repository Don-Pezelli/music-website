<title id="title">Ein Ton bewegt sich nach unten</title>
<desc id="desc">Auf weißem Hintergrund markieren zwei gleich große Punkte Ausgangs- und Zielton. Ein Pfeil führt dazwischen im 45-Grad-Winkel nach unten rechts: Der zweite Ton ist tiefer.</desc>
